# Generate the Xcode project with XcodeGen:
#   brew install xcodegen && xcodegen generate && open Hushbalm.xcodeproj
name: Hushbalm
options:
  bundleIdPrefix: com.hushbalm
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  HushbalmDesignSystem:
    path: Packages/HushbalmDesignSystem

targets:
  Hushbalm:
    type: application
    platform: iOS
    sources:
      - path: Hushbalm
        excludes:
          - "Resources/Products.storekit"
      - path: Hushbalm/Resources/Products.storekit
        buildPhase: none
    dependencies:
      - package: HushbalmDesignSystem
    info:
      path: Hushbalm/Info.plist
      properties:
        CFBundleDisplayName: Hushbalm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hushbalm.app   # TODO: your bundle id
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""   # TODO: your Apple Developer Team ID

schemes:
  Hushbalm:
    build:
      targets:
        Hushbalm: all
    run:
      config: Debug
      storeKitConfiguration: Hushbalm/Resources/Products.storekit
    archive:
      config: Release
