# Generate the Xcode project with XcodeGen:
#   brew install xcodegen && xcodegen generate && open Alji.xcodeproj
name: Alji
options:
  bundleIdPrefix: com.alji
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  AljiDesignSystem:
    path: Packages/AljiDesignSystem

targets:
  Alji:
    type: application
    platform: iOS
    sources:
      - path: Alji
        excludes:
          - "Resources/Products.storekit"
      - path: Alji/Resources/Products.storekit
        buildPhase: none
    dependencies:
      - package: AljiDesignSystem
    info:
      path: Alji/Info.plist
      properties:
        CFBundleDisplayName: Snuzzle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alji.app   # TODO: your bundle id
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""   # TODO: your Apple Developer Team ID

schemes:
  Alji:
    build:
      targets:
        Alji: all
    run:
      config: Debug
      storeKitConfiguration: Alji/Resources/Products.storekit
    archive:
      config: Release
